<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cart - bKash Demo</title>
  <link rel="stylesheet" href="/static/demo.css">
</head>
<body>
  <div class="card">
    <h2>🧺 Your Cart</h2>
    <table class="table">
      <thead><tr><th>Product</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead>
      <tbody>
        {% for it in items %}
        <tr>
          <td>{{ it.name }}</td>
          <td>{{ it.qty }}</td>
          <td>{{ it.price }}</td>
          <td>{{ it.line_total }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Cart is empty.</td></tr>
        {% endfor %}
      </tbody>
      <tfoot>
        <tr><th colspan="3">Grand Total</th><th>{{ total }}</th></tr>
      </tfoot>
    </table>
    <p>
      <a href="{% url 'payments:shop' %}">← Back to Shop</a> •
      <a href="{% url 'payments:cart_clear' %}">Clear Cart</a>
    </p>
    <p style="margin-top:12px">
      <a href="/payments/checkout/">Proceed to Checkout</a>
    </p>
  </div>
</body>
</html>
