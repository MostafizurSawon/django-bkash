<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Checkout - bKash Demo</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Ubuntu;margin:24px}
    .card{max-width:520px;margin:auto;padding:24px;border:1px solid #e5e7eb;border-radius:12px}
    input,button{padding:10px 12px;border-radius:8px;border:1px solid #d1d5db}
    button{cursor:pointer;margin-top:12px}
    .msg{color:#b91c1c;margin-bottom:10px}
  </style>
</head>
<body>
  <link rel="stylesheet" href="/static/demo.css">
  <div class="card">
    <p><a href="/payments/shop/">← Shop</a> • <a href="/payments/cart/">Cart</a></p>
    <h2>Demo Checkout (bKash Sandbox)</h2>
    {% if messages %}{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Enter Amount (BDT)</label><br>
      <input type="number" name="amount" step="0.01" min="1" required placeholder="100.00">
      <br>
      <button type="submit">Pay with bKash</button>
    </form>
    <p style="margin-top:16px;color:#6b7280;">Uses bKash tokenized checkout (sandbox). No DRF.</p>
  </div>
</body>
</html>
