<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Payment Failed</title></head>
<body style="font-family:system-ui;margin:24px">
  <h2>❌ Payment Failed</h2>
  {% if status %}<p>Status: {{ status }}</p>{% endif %}
  {% if invoice %}<p>Invoice: {{ invoice }}</p>{% endif %}
  <p><a href="/payments/checkout/">Try again</a></p>
</body>
</html>
